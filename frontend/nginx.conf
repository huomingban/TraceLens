server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video uploads are limited again by the API. This prevents Nginx from
    # rejecting a request before the application can return a useful message.
    client_max_body_size 512m;

    # Docker assigns a new IP when the API container is recreated. Resolve
    # the service name at request time so Nginx does not keep a stale IP.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:9090;

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /openapi.json { proxy_pass http://$api_upstream; }
    location /docs { proxy_pass http://$api_upstream; }
    location /redoc { proxy_pass http://$api_upstream; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
